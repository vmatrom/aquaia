server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /health { access_log off; default_type text/plain; return 200 'ok'; }
    location = /sw.js { add_header Cache-Control 'no-cache, no-store, must-revalidate'; }
    location = /index.html { add_header Cache-Control 'no-cache'; }
    location = /manifest.webmanifest { add_header Cache-Control 'no-cache'; }
    location /assets/ { try_files $uri =404; add_header Cache-Control 'public, max-age=3600'; }
    location / { try_files $uri $uri/ /index.html; }
}
